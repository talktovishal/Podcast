name: Migrate Deployment Secrets (One Time)

on:
  workflow_dispatch:
    inputs:
      expected_source_sha:
        description: "Reviewed full source-main commit SHA, not the live app version"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-azure-main
  cancel-in-progress: false

jobs:
  export:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.repository == 'talktovishal/Podcast' &&
      github.repository_id == '1152527211' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: production
    steps:
      - name: Checkout the dispatched source revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/secret-migration
            .github/workflows

      - name: Reject an unreviewed or changed source revision
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
        run: python3 -I scripts/secret-migration/sealed_export.py --validate-context

      - name: Install isolated hash-pinned cryptographic tooling without credentials
        run: |
          set -euo pipefail
          umask 077
          python3.12 -m venv "$RUNNER_TEMP/articlepod-secret-migration-venv"
          "$RUNNER_TEMP/articlepod-secret-migration-venv/bin/python" -I -m pip --isolated install \
            --index-url https://pypi.org/simple --require-hashes --only-binary=:all: \
            --no-deps --no-cache-dir --disable-pip-version-check \
            -r scripts/secret-migration/requirements.txt

      - name: Verify protocol and failure paths with synthetic values only
        run: |
          "$RUNNER_TEMP/articlepod-secret-migration-venv/bin/python" -I -m unittest \
            discover -s scripts/secret-migration/tests -v

      - name: Seal the exact approved values to the fixed private environment
        env:
          EXPECTED_SOURCE_SHA: ${{ inputs.expected_source_sha }}
          MIGRATE_ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          MIGRATE_APP_ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD }}
          MIGRATE_APP_AZURE_OPENAI_API_KEY: ${{ secrets.APP_AZURE_OPENAI_API_KEY }}
          MIGRATE_APP_AZURE_OPENAI_BASE_URL: ${{ secrets.APP_AZURE_OPENAI_BASE_URL }}
          MIGRATE_APP_AZURE_OPENAI_SUMMARY_MINI_DEPLOYMENT: ${{ secrets.APP_AZURE_OPENAI_SUMMARY_MINI_DEPLOYMENT }}
          MIGRATE_APP_AZURE_OPENAI_SUMMARY_NANO_DEPLOYMENT: ${{ secrets.APP_AZURE_OPENAI_SUMMARY_NANO_DEPLOYMENT }}
          MIGRATE_APP_AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.APP_AZURE_STORAGE_CONNECTION_STRING }}
          MIGRATE_APP_BILLING_SANDBOX_ALLOWLIST_EMAILS: ${{ secrets.APP_BILLING_SANDBOX_ALLOWLIST_EMAILS }}
          MIGRATE_APP_DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
          MIGRATE_APP_DEMO_PASSWORD: ${{ secrets.APP_DEMO_PASSWORD }}
          MIGRATE_APP_DOMAIN_ALIASES: ${{ secrets.APP_DOMAIN_ALIASES }}
          MIGRATE_APP_GOOGLE_CLIENT_ID: ${{ secrets.APP_GOOGLE_CLIENT_ID }}
          MIGRATE_APP_GOOGLE_CLIENT_SECRET: ${{ secrets.APP_GOOGLE_CLIENT_SECRET }}
          MIGRATE_APP_STRIPE_BILLING_PORTAL_CONFIGURATION_ID: ${{ secrets.APP_STRIPE_BILLING_PORTAL_CONFIGURATION_ID }}
          MIGRATE_APP_STRIPE_LIVE_BILLING_PORTAL_CONFIGURATION_ID: ${{ secrets.APP_STRIPE_LIVE_BILLING_PORTAL_CONFIGURATION_ID }}
          MIGRATE_APP_STRIPE_LIVE_PRICE_PRO_ANNUAL: ${{ secrets.APP_STRIPE_LIVE_PRICE_PRO_ANNUAL }}
          MIGRATE_APP_STRIPE_LIVE_PRICE_PRO_MONTHLY: ${{ secrets.APP_STRIPE_LIVE_PRICE_PRO_MONTHLY }}
          MIGRATE_APP_STRIPE_LIVE_SECRET_KEY: ${{ secrets.APP_STRIPE_LIVE_SECRET_KEY }}
          MIGRATE_APP_STRIPE_LIVE_WEBHOOK_SECRET: ${{ secrets.APP_STRIPE_LIVE_WEBHOOK_SECRET }}
          MIGRATE_APP_STRIPE_PRICE_PRO_ANNUAL: ${{ secrets.APP_STRIPE_PRICE_PRO_ANNUAL }}
          MIGRATE_APP_STRIPE_PRICE_PRO_MONTHLY: ${{ secrets.APP_STRIPE_PRICE_PRO_MONTHLY }}
          MIGRATE_APP_STRIPE_SANDBOX_BILLING_PORTAL_CONFIGURATION_ID: ${{ secrets.APP_STRIPE_SANDBOX_BILLING_PORTAL_CONFIGURATION_ID }}
          MIGRATE_APP_STRIPE_SANDBOX_PRICE_PRO_ANNUAL: ${{ secrets.APP_STRIPE_SANDBOX_PRICE_PRO_ANNUAL }}
          MIGRATE_APP_STRIPE_SANDBOX_PRICE_PRO_MONTHLY: ${{ secrets.APP_STRIPE_SANDBOX_PRICE_PRO_MONTHLY }}
          MIGRATE_APP_STRIPE_SANDBOX_SECRET_KEY: ${{ secrets.APP_STRIPE_SANDBOX_SECRET_KEY }}
          MIGRATE_APP_STRIPE_SANDBOX_WEBHOOK_SECRET: ${{ secrets.APP_STRIPE_SANDBOX_WEBHOOK_SECRET }}
          MIGRATE_APP_STRIPE_SECRET_KEY: ${{ secrets.APP_STRIPE_SECRET_KEY }}
          MIGRATE_APP_STRIPE_WEBHOOK_SECRET: ${{ secrets.APP_STRIPE_WEBHOOK_SECRET }}
          MIGRATE_APP_URL: ${{ secrets.APP_URL }}
          MIGRATE_APP_WEBSTORE_REVIEWER_EMAIL: ${{ secrets.APP_WEBSTORE_REVIEWER_EMAIL }}
          MIGRATE_APP_WEBSTORE_REVIEWER_PASSWORD: ${{ secrets.APP_WEBSTORE_REVIEWER_PASSWORD }}
          MIGRATE_AZURE_SSH_KEY: ${{ secrets.AZURE_SSH_KEY }}
          MIGRATE_AZURE_SSH_KNOWN_HOSTS: ${{ secrets.AZURE_SSH_KNOWN_HOSTS }}
          MIGRATE_AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
          MIGRATE_DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
          MIGRATE_LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
          MIGRATE_APP_SMOKE_FEED_TOKEN: ${{ secrets.APP_SMOKE_FEED_TOKEN }}
        run: |
          "$RUNNER_TEMP/articlepod-secret-migration-venv/bin/python" -I \
            scripts/secret-migration/sealed_export.py

      - name: Upload only ciphertext and the public checkout key
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: articlepod-sealed-secret-transfer
          path: |
            ${{ runner.temp }}/articlepod-sealed-secret-transfer/sealed-secrets.json
            ${{ runner.temp }}/articlepod-sealed-secret-transfer/articlepod-source-read.pub
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
          include-hidden-files: false

      - name: Remove ephemeral checkout key files even after failure
        if: always()
        run: python3 -I scripts/secret-migration/sealed_export.py --cleanup
