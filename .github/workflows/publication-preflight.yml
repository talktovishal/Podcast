name: Publication Preflight (Read Only)

on:
  workflow_dispatch:
    inputs:
      validation_only:
        description: "Run offline checks only, without SSH or production inventory"
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: publication-preflight
  cancel-in-progress: false

jobs:
  validation:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Test redacted inventory output
        run: python3 -m unittest discover -s scripts/azure/tests -p test_publication_preflight.py
      - name: Test version-pinned secret loading
        run: python3 -m unittest discover -s scripts/azure/tests -p test_keyvault_exec.py
      - name: Test opt-in runtime routing and legacy deployment guards
        run: python3 -m unittest discover -s scripts/azure/tests -p test_runtime_secret_routing.py
      - name: Test build environment isolation
        run: python3 -m unittest discover -s scripts/azure/tests -p test_secret_free_build.py
      - name: Compile vault-only infrastructure
        run: az bicep build --file infra/secrets.bicep --outfile "$RUNNER_TEMP/articlepod-vault.json"
      - name: Explain validation-only boundary
        if: inputs.validation_only
        run: |
          echo "Offline checks only. No production inventory, deployment, credential rotation, or publication occurred." >> "$GITHUB_STEP_SUMMARY"

  build-validation:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install declared dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Prime Prisma client
        run: node scripts/ensure-prisma-generated.mjs
      - name: Test deferred Azure initialization
        run: corepack pnpm --filter @articlepod/core exec tsx --test tests/azure-table-initialization.test.ts tests/azure-table-primary-store.test.ts
      - name: Test build and runtime environment boundaries
        run: corepack pnpm --filter @articlepod/web exec tsx --test tests/secret-free-build.test.ts tests/env-path-normalization.test.ts
      - name: Type-check and build shared stores
        run: |
          corepack pnpm --filter @articlepod/core run typecheck
          corepack pnpm --filter @articlepod/core run build
      - name: Build without service credentials and verify compiled runtime guards
        run: |
          python3 scripts/azure/verify-secret-free-build.py --metadata-backend azure_table
          python3 scripts/azure/verify-secret-free-build.py --metadata-backend prisma

  inventory:
    if: github.ref == 'refs/heads/main' && !inputs.validation_only
    needs: [validation, build-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@v6
      - name: Inspect running service and managed identity
        env:
          TARGET_HOST: ${{ secrets.AZURE_VM_HOST }}
          TARGET_USER: ${{ secrets.AZURE_VM_USER || 'azureuser' }}
          AZURE_SSH_KEY: ${{ secrets.AZURE_SSH_KEY }}
          AZURE_SSH_KNOWN_HOSTS: ${{ secrets.AZURE_SSH_KNOWN_HOSTS }}
        run: python3 scripts/azure/publication-preflight.py
