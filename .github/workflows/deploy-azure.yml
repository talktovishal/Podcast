name: Deploy to Azure

on:
  workflow_dispatch:
    inputs:
      skip_healthcheck:
        description: 'Skip health check after deployment'
        required: false
        type: boolean
        default: false
      full_deploy:
        description: 'Force full runtime setup (deps + python-tts + demo seed)'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: deploy-azure-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[deploy]'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate deploy target
        env:
          TARGET_HOST: ${{ secrets.AZURE_VM_HOST }}
          TARGET_USER: ${{ secrets.AZURE_VM_USER || 'azureuser' }}
        run: |
          set -euo pipefail
          if [ -z "$TARGET_HOST" ]; then
            echo "::error::AZURE_VM_HOST secret is not configured"
            exit 1
          fi
          if [ "${{ github.ref_name }}" != "main" ]; then
            echo "::error::Deploy workflow must run from main branch"
            exit 1
          fi
          if [ -z "$TARGET_USER" ]; then
            echo "::error::AZURE_VM_USER resolved to empty value"
            exit 1
          fi

      - name: Setup SSH credentials
        env:
          AZURE_SSH_KEY: ${{ secrets.AZURE_SSH_KEY }}
          AZURE_VM_HOST: ${{ secrets.AZURE_VM_HOST }}
        run: |
          set -euo pipefail
          if [ -z "$AZURE_SSH_KEY" ]; then
            echo "::error::AZURE_SSH_KEY secret is not configured"
            echo "Please configure the following secrets in your repository:"
            echo "  - AZURE_SSH_KEY: SSH private key for VM access"
            echo "  - AZURE_VM_HOST: VM IP address or FQDN"
            exit 1
          fi

          mkdir -p ~/.ssh

          # Write SSH private key
          printf "%s\n" "$AZURE_SSH_KEY" > ~/.ssh/articlepod_azure
          chmod 600 ~/.ssh/articlepod_azure

          if ! grep -q "BEGIN OPENSSH PRIVATE KEY" ~/.ssh/articlepod_azure; then
            echo "::error::AZURE_SSH_KEY does not look like an OpenSSH private key"
            exit 1
          fi

          # Create SSH config with permissive host key checking (acceptable in CI environment)
          {
            echo "Host *"
            echo "    StrictHostKeyChecking no"
            echo "    UserKnownHostsFile=/dev/null"
            echo "    LogLevel QUIET"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy to Azure VM
        env:
          TARGET_HOST: ${{ secrets.AZURE_VM_HOST }}
          TARGET_USER: ${{ secrets.AZURE_VM_USER || 'azureuser' }}
          # App secrets forwarded to render-env.sh on the VM
          DATABASE_URL: ${{ secrets.APP_DATABASE_URL }}
          APP_URL: ${{ secrets.APP_URL }}
          APP_DOMAIN_ALIASES: ${{ secrets.APP_DOMAIN_ALIASES || 'www.articlepod.com' }}
          LETSENCRYPT_EMAIL: ${{ secrets.LETSENCRYPT_EMAIL }}
          STORAGE_BACKEND: azure_blob
          AZURE_STORAGE_CONTAINER: ${{ secrets.APP_AZURE_STORAGE_CONTAINER || 'articlepod' }}
          AZURE_STORAGE_CONNECTION_STRING: ${{ secrets.APP_AZURE_STORAGE_CONNECTION_STRING }}
          PYTHON_TTS_URL: http://127.0.0.1:8010
          ADMIN_PASSWORD: ${{ secrets.APP_ADMIN_PASSWORD }}
          DEMO_PASSWORD: ${{ secrets.APP_DEMO_PASSWORD }}
        run: |
          set -euo pipefail

          echo "::group::Deploying to $TARGET_HOST"
          TARGET_SSH_KEY="$HOME/.ssh/articlepod_azure"

          if [ ! -f "$TARGET_SSH_KEY" ]; then
            echo "::error::SSH key not found at $TARGET_SSH_KEY"
            exit 1
          fi

          if [ -z "$APP_URL" ]; then
            echo "::error::APP_URL secret is not configured"
            exit 1
          fi

          if [ "$APP_URL" != "https://articlepod.com" ]; then
            echo "::error::APP_URL must be set to https://articlepod.com for production canonical URLs"
            exit 1
          fi

          if [ -z "$LETSENCRYPT_EMAIL" ]; then
            echo "::error::LETSENCRYPT_EMAIL secret is not configured"
            exit 1
          fi

          CANONICAL_HOST="${APP_URL#*://}"
          CANONICAL_HOST="${CANONICAL_HOST%%/*}"

          DEPLOY_ARGS=(
            --host "$TARGET_HOST"
            --user "$TARGET_USER"
            --ssh-key "$TARGET_SSH_KEY"
            --render-env
            --seed-mode always
            --configure-ingress
            --canonical-host "$CANONICAL_HOST"
            --host-aliases "$APP_DOMAIN_ALIASES"
            --letsencrypt-email "$LETSENCRYPT_EMAIL"
          )

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.skip_healthcheck }}" = "true" ]; then
            DEPLOY_ARGS+=(--skip-healthcheck)
          fi

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.full_deploy }}" = "true" ]; then
            DEPLOY_ARGS+=(--full-deploy)
            echo "Deploy mode: full"
          else
            echo "Deploy mode: fast (incremental)"
          fi

          ./scripts/azure/deploy-changes.sh "${DEPLOY_ARGS[@]}"

          echo "::endgroup::"

      - name: Deployment summary
        if: success()
        run: |
          echo "## ✅ Deployment Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Deployed to: \`${{ secrets.AZURE_VM_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY

      - name: Deployment failed
        if: failure()
        run: |
          echo "## ❌ Deployment Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the logs above for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Common issues:" >> $GITHUB_STEP_SUMMARY
          echo "- SSH key permissions" >> $GITHUB_STEP_SUMMARY
          echo "- VM connectivity" >> $GITHUB_STEP_SUMMARY
          echo "- Service restart failures" >> $GITHUB_STEP_SUMMARY
