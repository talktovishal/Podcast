name: CI

# validate-simple  — runs on every push and PR (fast: ~10-15 min)
#   typecheck, lint, unit tests, build, license gate
#
# validate-parity  — full integration check (slow: ~30-45 min, includes Docker
#   build of python-tts with ML packages). Runs only when needed:
#     • every push to main
#     • workflow_dispatch with run_parity: true
#     • any PR that carries the "full-ci" label

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_parity:
        description: "Run full parity check (Docker stack incl. python-tts)"
        required: false
        type: boolean
        default: false

jobs:
  validate-simple:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare simple profile env
        run: cp .env.simple.example .env

      - name: Install dependencies
        run: npx pnpm install --frozen-lockfile

      - name: Environment check (simple)
        run: npm run check:env:simple

      - name: Naming check
        run: npm run naming:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Observability verify
        run: npm run observability:verify

      - name: Build
        run: npm run build

      - name: Export
        run: npm run export

      - name: License gate
        run: npm run license:check

  validate-parity:
    runs-on: ubuntu-latest
    needs: validate-simple
    timeout-minutes: 45
    # Run on main, manual dispatch (opt-in), or PRs labelled "full-ci"
    if: |
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && inputs.run_parity == true) ||
      (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes 2>/dev/null || true
          df -h

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare parity profile env
        run: cp .env.parity.example .env

      - name: Install dependencies
        run: npx pnpm install --frozen-lockfile

      - name: Environment check (parity)
        run: npm run check:env:parity

      - name: Start parity stack
        run: npm run parity:up

      - name: Parity smoke + podcast contract
        run: npm run parity:smoke

      - name: Stop parity stack
        if: always()
        run: npm run parity:down
