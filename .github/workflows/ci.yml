name: CI

# Quick pull-request CI.
# Keeps per-update validation small and defers expensive build/export/observability
# and parity checks to the nightly workflow or explicit/manual runs.

on:
  pull_request:
  workflow_dispatch:
    inputs:
      run_parity:
        description: "Run parity check for this branch"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate-secret-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/secret-migration
            .github/workflows
            .github/workflow-fixtures
      - name: Test isolated secret migration with synthetic values
        run: |
          set -euo pipefail
          python3.12 -m venv "$RUNNER_TEMP/articlepod-secret-migration-venv"
          "$RUNNER_TEMP/articlepod-secret-migration-venv/bin/python" -I -m pip --isolated install \
            --index-url https://pypi.org/simple --require-hashes --only-binary=:all: \
            --no-deps --no-cache-dir --disable-pip-version-check \
            -r scripts/secret-migration/requirements.txt
          "$RUNNER_TEMP/articlepod-secret-migration-venv/bin/python" -I -m unittest \
            discover -s scripts/secret-migration/tests -v

  plan:
    runs-on: ubuntu-latest
    outputs:
      changed_file_count: ${{ steps.scope.outputs.changed_file_count }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      run_simple: ${{ steps.scope.outputs.run_simple }}
      run_env_simple: ${{ steps.scope.outputs.run_env_simple }}
      run_naming: ${{ steps.scope.outputs.run_naming }}
      run_core: ${{ steps.scope.outputs.run_core }}
      run_web: ${{ steps.scope.outputs.run_web }}
      run_worker: ${{ steps.scope.outputs.run_worker }}
      run_testing: ${{ steps.scope.outputs.run_testing }}
      run_license: ${{ steps.scope.outputs.run_license }}
      run_parity: ${{ steps.scope.outputs.run_parity }}
      summary: ${{ steps.scope.outputs.summary }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute CI scope
        id: scope
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
        run: node scripts/ci-scope.mjs --format github-output >> "$GITHUB_OUTPUT"

      - name: Scope summary
        run: |
          echo "summary: ${{ steps.scope.outputs.summary }}"
          echo "changed files: ${{ steps.scope.outputs.changed_file_count }}"

  docs-only:
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.run_simple != 'true'
    steps:
      - name: Docs-only summary
        run: echo "${{ needs.plan.outputs.summary }}"

  validate-quick:
    runs-on: ubuntu-latest
    needs: plan
    if: needs.plan.outputs.run_simple == 'true'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare simple profile env
        run: cp .env.simple.example .env

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: CI scope unit tests
        run: node --test scripts/ci-scope.test.mjs

      - name: Prime Prisma client
        run: node scripts/ensure-prisma-generated.mjs

      - name: Environment check (simple)
        if: needs.plan.outputs.run_env_simple == 'true'
        run: npm run check:env:simple

      - name: Naming check
        if: needs.plan.outputs.run_naming == 'true'
        run: npm run naming:check

      - name: Core typecheck
        if: needs.plan.outputs.run_core == 'true'
        run: corepack pnpm --filter @articlepod/core run typecheck

      - name: Core test
        if: needs.plan.outputs.run_core == 'true'
        run: corepack pnpm --filter @articlepod/core run test

      - name: Web typecheck
        if: needs.plan.outputs.run_web == 'true'
        run: corepack pnpm --filter @articlepod/web run typecheck

      - name: Web lint
        if: needs.plan.outputs.run_web == 'true'
        run: corepack pnpm --filter @articlepod/web run lint

      - name: Web test
        if: needs.plan.outputs.run_web == 'true'
        run: corepack pnpm --filter @articlepod/web run test

      - name: Worker typecheck
        if: needs.plan.outputs.run_worker == 'true'
        run: corepack pnpm --filter @articlepod/worker run typecheck

      - name: Worker test
        if: needs.plan.outputs.run_worker == 'true'
        run: corepack pnpm --filter @articlepod/worker run test

      - name: Live-site typecheck
        if: needs.plan.outputs.run_testing == 'true'
        run: corepack pnpm --filter @articlepod/live-site run typecheck

      - name: Live-site test
        if: needs.plan.outputs.run_testing == 'true'
        run: corepack pnpm --filter @articlepod/live-site run test

      - name: Extraction-quality typecheck
        if: needs.plan.outputs.run_testing == 'true'
        run: corepack pnpm --filter @articlepod/extraction-quality run typecheck

      - name: Extraction-quality test
        if: needs.plan.outputs.run_testing == 'true'
        run: corepack pnpm --filter @articlepod/extraction-quality run test

      - name: License gate
        if: needs.plan.outputs.run_license == 'true'
        run: npm run license:check

  validate-parity:
    runs-on: ubuntu-latest
    needs: [plan, validate-quick]
    timeout-minutes: 45
    if: |
      needs.plan.outputs.run_simple == 'true' &&
      needs.validate-quick.result == 'success' &&
      (
        (github.event_name == 'workflow_dispatch' && inputs.run_parity == true) ||
        (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
      ) &&
      needs.plan.outputs.run_parity == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes 2>/dev/null || true
          df -h

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Prepare parity profile env
        run: cp .env.parity.example .env

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Prime Prisma client
        run: RUNTIME_PROFILE=parity node scripts/ensure-prisma-generated.mjs

      - name: Environment check (parity)
        run: npm run check:env:parity

      - name: Start parity stack
        run: npm run parity:up

      - name: Parity smoke + podcast contract
        id: parity_smoke
        run: npm run parity:smoke

      - name: Collect parity smoke failure diagnostics
        if: failure() && steps.parity_smoke.outcome == 'failure'
        timeout-minutes: 2
        run: |
          docker compose -f docker-compose.parity.yml ps --all
          docker compose -f docker-compose.parity.yml logs --no-color --tail=100 web worker azurite postgres python-tts
          docker inspect --format 'name={{.Name}} status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} restarts={{.RestartCount}}' articlepod-web articlepod-worker

      - name: Stop parity stack
        if: always()
        run: npm run parity:down
