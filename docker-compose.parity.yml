services:
  postgres:
    image: postgres:16-alpine
    container_name: articlepod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: articlepod
      POSTGRES_USER: articlepod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-articlepod}
    ports:
      - "5432:5432"
    volumes:
      - postgres_parity_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U articlepod -d articlepod"]
      interval: 5s
      timeout: 5s
      retries: 20

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.33.0
    container_name: articlepod-azurite
    restart: unless-stopped
    command: "azurite --blobHost 0.0.0.0 --blobPort 10000 --queueHost 0.0.0.0 --queuePort 10001 --skipApiVersionCheck"
    ports:
      - "10000:10000"
      - "10001:10001"
    volumes:
      - azurite_parity_data:/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:10000').then(()=>process.exit(0)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 20

  python-tts:
    build:
      context: .
      dockerfile: services/python-tts/Dockerfile
    container_name: articlepod-python-tts
    restart: unless-stopped
    ports:
      - "8010:8010"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8010/health >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: articlepod-web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_healthy
      python-tts:
        condition: service_healthy
    environment:
      RUNTIME_PROFILE: parity
      DATABASE_URL: postgresql://articlepod:${POSTGRES_PASSWORD:-articlepod}@postgres:5432/articlepod
      APP_URL: http://localhost:3000
      STORAGE_BACKEND: azure_blob
      AZURE_STORAGE_CONTAINER: articlepod
      AZURE_STORAGE_CREATE_CONTAINER: "1"
      AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;
      ITEM_DISPATCH_BACKEND: azure_queue
      DIGEST_SCHEDULER_SECRET: ${DIGEST_SCHEDULER_SECRET}
      MEDIA_SIGNING_KEY: ${MEDIA_SIGNING_KEY}
      PYTHON_TTS_URL: http://python-tts:8010
      PYTHON_TTS_TIMEOUT_MS: "120000"
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@articlepod.local}
      DEMO_PASSWORD: ${DEMO_PASSWORD}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@articlepod.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    command: >
      sh -lc "npx pnpm --filter @articlepod/web run db:bootstrap &&
      npx pnpm --filter @articlepod/web run seed:demo &&
      npx pnpm --filter @articlepod/web run start"
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      start_period: 120s
      interval: 15s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: articlepod-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      azurite:
        condition: service_healthy
      python-tts:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      RUNTIME_PROFILE: parity
      DATABASE_URL: postgresql://articlepod:${POSTGRES_PASSWORD:-articlepod}@postgres:5432/articlepod
      STORAGE_BACKEND: azure_blob
      AZURE_STORAGE_CONTAINER: articlepod
      AZURE_STORAGE_CREATE_CONTAINER: "1"
      AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;
      ITEM_DISPATCH_BACKEND: azure_queue
      DIGEST_SCHEDULER_SECRET: ${DIGEST_SCHEDULER_SECRET}
      PYTHON_TTS_URL: http://python-tts:8010
      PYTHON_TTS_TIMEOUT_MS: "120000"
      WORKER_POLL_MS: "2000"
      WORKER_STALE_PROCESSING_MS: "900000"
      ITEM_DISPATCH_HEARTBEAT_MS: "30000"
      WORKER_RETRY_POLL_MS: "5000"
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@articlepod.local}
    command: >
      sh -lc "npx pnpm --filter @articlepod/worker run dev"

volumes:
  postgres_parity_data:
  azurite_parity_data:
