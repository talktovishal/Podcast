<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Short Take on X: "Just shipped v2.0!"</title>
  <meta property="og:description" content="Just shipped v2.0!" />
  <style>body { font-family: sans-serif; }</style>
</head>
<body>
  <div id="react-root">
    <header role="banner">
      <nav><a href="/home">Home</a></nav>
    </header>
    <main>
      <article data-testid="tweet" role="article">
        <div data-testid="tweetText">
          <p>Just shipped v2.0!</p>
        </div>
        <div data-testid="tweet-actions">
          <span>45 replies</span>
          <span>230 reposts</span>
          <span>1.2K likes</span>
        </div>
      </article>
    </main>
    <footer><p>&copy; 2026 X Corp.</p></footer>
  </div>
</body>
</html>
