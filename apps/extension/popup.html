<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArticlePod Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <h1>ArticlePod Capture</h1>
      <p class="muted">Connect once, then capture the current tab into your podcast queue.</p>

      <p id="connection-state" class="state-pill">Not configured</p>

      <section id="connect-section" class="connect-section">
        <label>
          <span>One-time connect code</span>
          <input id="connect-code" type="text" placeholder="Paste code from /app" />
        </label>
        <button id="connect-btn" type="button">Connect</button>
      </section>

      <div class="row actions">
        <button id="disconnect-btn" type="button" class="secondary">Disconnect</button>
        <button id="capture-btn" type="button" class="primary">Capture Current Page</button>
      </div>

      <section id="capture-options" class="capture-options">
        <div class="optional-card">
          <div class="optional-card-header">
            <span class="optional-badge">Optional</span>
          </div>

          <div class="optional-fields">
            <label>
              <span>Importance</span>
              <select id="capture-importance">
                <option value="LOW" selected>Low</option>
                <option value="MEDIUM">Medium</option>
                <option value="HIGH">High</option>
              </select>
            </label>
            <label>
              <span>Tags</span>
              <input id="capture-tags" type="text" placeholder="financial, personal, retirement" />
            </label>
          </div>
        </div>
      </section>

      <p id="token-state" class="muted"></p>
      <p id="status" class="status"></p>
      <div class="footer-link-row">
        <a class="footer-link" href="https://articlepod.com/" target="_blank" rel="noopener noreferrer">
          articlepod.com
        </a>
      </div>
    </main>

    <script src="runtime-config.js"></script>
    <script type="module" src="popup.js"></script>
  </body>
</html>
