<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ArticlePod Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <h1>ArticlePod Capture</h1>
      <p class="muted">Connect once, then capture the current tab into your podcast queue.</p>

      <p id="connection-state" class="state-pill">Not configured</p>

      <section id="connect-section" class="connect-section">
        <label>
          <span>One-time connect code</span>
          <input id="connect-code" type="text" placeholder="Paste code from /app" />
        </label>
        <button id="connect-btn" type="button">Connect</button>
      </section>

      <div class="row actions">
        <button id="disconnect-btn" type="button" class="secondary">Disconnect</button>
        <button id="capture-btn" type="button" class="primary">Capture Current Page</button>
      </div>

      <p id="token-state" class="muted"></p>
      <p id="status" class="status"></p>
    </main>

    <script src="runtime-config.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
